name: Generate Release Maintenance

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The release version (e.g., v2.14.1). If left blank, current branch is used'
        required: false
        default: ''
      release_date:
        description: 'The release date (e.g., 2026-05-27)'
        required: true
      prime:
        description: 'Is this version available in Prime? (Default: y)'
        required: false
        default: 'y'
      community:
        description: 'Is this version available in Community? (Default: y)'
        required: false
        default: 'y'

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write # Vault access
    env:
      BASE_BRANCH: 'main'
      DATE: ${{ inputs.release_date }}
      PRIME: ${{ inputs.prime }}
      COMMUNITY: ${{ inputs.community }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Determine version and base branch
        run: |
          # Determine VERSION
          if [[ -z "$VERSION" ]]; then
            if [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              VERSION="${{ github.ref_name }}"
              echo "Used version from branch name: $VERSION"
            fi
          fi

          if [[ -z "$VERSION" ]]; then
            echo "Error: Version could not be determined. Please provide the 'version' input or run from a release branch (vX.Y.Z)." >&2
            exit 1
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV

          # Determine BASE_BRANCH
          if git ls-remote https://github.com/rancher/rancher-product-docs "$VERSION" | grep -q "$VERSION"; then
            echo "BASE_BRANCH=$VERSION" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" != "HEAD" ]] && git ls-remote https://github.com/rancher/rancher-product-docs "${{ github.ref_name }}" | grep -q "${{ github.ref_name }}"; then
            echo "BASE_BRANCH=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "BASE_BRANCH=main" >> $GITHUB_ENV
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_BRANCH }}

      - name: Generate Release Maintenance
        run: |
          ./scripts/release-maintenance.sh -v "$VERSION" -d "$DATE" --prime "$PRIME" --community "$COMMUNITY"

      - name: Load App Credentials from Vault
        uses: rancher-eio/read-vault-secrets@4c8f4e741954651c502bb7739c46ae1bad26b44d # main
        continue-on-error: true
        with:
          secrets: |
            github/token/rancher--rancher-product-docs--pull_requests--write token | GH_TOKEN

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ env.GH_TOKEN || github.token }}
        run: |
          BRANCH_NAME="${VERSION}-maintenance"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Use GH_TOKEN for git operations so commits are verified
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          git checkout -b "$BRANCH_NAME"
          git add .
          git diff --cached --quiet || git commit -m "$VERSION - Release Maintenance"

          git push -f origin "$BRANCH_NAME"

          PR_NUMBER=$(gh pr list --head "$BRANCH_NAME" --base "$BASE_BRANCH" --json number --jq '.[0].number')

          CMD_EXECUTED="./scripts/release-maintenance.sh -v \"$VERSION\" -d \"$DATE\" --prime \"$PRIME\" --community \"$COMMUNITY\""

          PR_BODY="Automated release maintenance updates for version $VERSION."$'\n'"Command executed: \`$CMD_EXECUTED\`"

          # Search for the release maintenance issue
          IS_FORK=$(gh repo view "${{ github.repository }}" --json isFork --jq '.isFork')
          if [[ "$IS_FORK" == "false" ]]; then
            ISSUE_NUMBER=$(GH_TOKEN=${{ github.token }} gh issue list --repo "${{ github.repository }}" --search "\"$VERSION\" \"Rancher Manager Release Maintenance Task Checklist\" in:title is:open" --json number --jq '.[0].number')
            if [[ -n "$ISSUE_NUMBER" && "$ISSUE_NUMBER" != "null" ]]; then
              PR_BODY="$PR_BODY"$'\n\n'"Relates to #$ISSUE_NUMBER"
            fi
          fi

          if [[ -n "$PR_NUMBER" && "$PR_NUMBER" != "null" ]]; then
            gh pr edit "$PR_NUMBER" \
              --title "$VERSION - Release Maintenance" \
              --body "$PR_BODY"
          else
            PR_URL=$(gh pr create \
              --title "$VERSION - Release Maintenance" \
              --body "$PR_BODY" \
              --base "$BASE_BRANCH" \
              --head "$BRANCH_NAME" \
              --milestone "$VERSION")
            PR_NUMBER=${PR_URL##*/}
          fi

          # Attempt to trigger CI workflows by pushing an empty commit, also allows for squashing commits to get them verified
          git commit --allow-empty -m "Trigger CI"
          git push origin "$BRANCH_NAME"
